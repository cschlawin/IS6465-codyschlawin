<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a tutoring session</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container py-5">
        <h1>Request a tutoring session</h1>

        <form class="request-form" action="process-request.php" method="post">
            <div class="form-group">
                <label for="course">Course</label>
                <input id="course" name="course" required>
            </div>

            <div class="form-group">
                <label for="date">Preferred date</label>
                <input id="date" name="date" type="date" required>
            </div>
            <button type="submit">Request session</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
